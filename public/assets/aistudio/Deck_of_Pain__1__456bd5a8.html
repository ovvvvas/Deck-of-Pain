<style>
:root{--bg:#e7eaf0;--hi:#fbfcff;--sh:#b9c0cf;--tx:#2a3040;--mut:#5b647a;--ac:#c85f30;--ac2:#ae4b1f;--card:#f6f7fb;--red:#c9482a;--paper:#fdfbf4;--ink:#22252e;--rule:rgba(42,48,64,.2);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d2129;--hi:#2b303b;--sh:#0e1014;--tx:#e9ebf1;--mut:#8f97aa;--ac:#ee8a58;--ac2:#d9703d;--card:#262b35;--red:#f0805a;--paper:#2a2f3a;--ink:#e9ebf1;--rule:rgba(233,235,241,.18);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d2129;--hi:#2b303b;--sh:#0e1014;--tx:#e9ebf1;--mut:#8f97aa;--ac:#ee8a58;--ac2:#d9703d;--card:#262b35;--red:#f0805a;--paper:#2a2f3a;--ink:#e9ebf1;--rule:rgba(233,235,241,.18);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font-family:'Space Grotesk',system-ui,sans-serif;margin:0;min-height:100vh;min-height:100dvh;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}html{-webkit-text-size-adjust:100%}
.mut{color:var(--mut)}
.neu-raised{background:linear-gradient(145deg,var(--hi),var(--bg) 60%);box-shadow:8px 8px 18px var(--sh),-8px -8px 18px var(--hi)}
.neu-flat{background:var(--bg);box-shadow:5px 5px 11px var(--sh),-5px -5px 11px var(--hi)}

.press:active{box-shadow:inset 4px 4px 8px var(--sh),inset -4px -4px 8px var(--hi)}
.btn{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:999px;padding:0 1.1rem;font-weight:500;cursor:pointer;border:0;color:var(--tx);transition:box-shadow .15s}
.btn:focus-visible,.pre:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.cta{background:linear-gradient(145deg,var(--ac),var(--ac2));color:#fff;box-shadow:6px 6px 14px var(--sh),-4px -4px 10px var(--hi);letter-spacing:.02em;font-weight:700}
.cta:active{box-shadow:inset 3px 3px 8px rgba(0,0,0,.3)}
.mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,Menlo,monospace}
.red{color:var(--red)}
.deal{animation:flipin .7s cubic-bezier(.34,1.4,.64,1);transform-style:preserve-3d}.face{position:absolute;inset:0;border-radius:6.5cqw;backface-visibility:hidden;-webkit-backface-visibility:hidden}.back{transform:rotateY(180deg);background:repeating-linear-gradient(45deg,var(--card),var(--card) 8px,var(--bg) 8px,var(--bg) 16px);display:flex;align-items:center;justify-content:center;font-size:34cqw;color:var(--ac)}.toss{animation:toss .5s ease-in forwards;pointer-events:none}

.btn,.pre{touch-action:manipulation}
